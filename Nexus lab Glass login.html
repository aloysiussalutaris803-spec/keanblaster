<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in</title>
<style>
:root{
  --black:#050505; --yellow:#FFE46B; --blue:#2F7BFF; --text:#F6F3E4; --muted:rgba(246,243,228,.68);
  --glass:rgba(255,255,255,.08); --glass-edge:rgba(255,255,255,.28); --err:#FF8A80;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 15% 20%,var(--yellow) 0,transparent 34%),
    radial-gradient(circle at 88% 80%,var(--blue) 0,transparent 38%),
    radial-gradient(circle at 80% 8%,rgba(47,123,255,.55) 0,transparent 24%),
    radial-gradient(circle at 10% 92%,rgba(255,228,107,.5) 0,transparent 26%),
    var(--black);
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden;
}
.card{
  width:100%;max-width:420px;padding:36px 32px;border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
  border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35);
}
h1{margin:0 0 6px;font-size:2rem;line-height:1.1;letter-spacing:-.02em}
.sub{margin:0 0 26px;color:var(--muted)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.social button{
  display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 10px;
  background:var(--glass);color:var(--text);border:1px solid var(--glass-edge);border-radius:14px;
  font:inherit;font-size:.95rem;font-weight:500;cursor:pointer;
}
.social button:hover{background:rgba(255,255,255,.16)}
.social svg{width:20px;height:20px;flex:none}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:0 0 22px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--glass-edge)}
.field{margin-bottom:16px;position:relative}
.field label{display:block;font-size:.85rem;margin:0 0 6px;color:var(--muted)}
.field input{
  width:100%;padding:13px 14px;border-radius:14px;font:inherit;color:var(--text);
  background:rgba(0,0,0,.35);border:1px solid var(--glass-edge);outline:none;
}
.field input::placeholder{color:rgba(246,243,228,.35)}
.field input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,228,107,.25)}
.show{position:absolute;right:10px;top:33px;background:none;border:0;color:var(--blue);font:inherit;font-size:.85rem;cursor:pointer;padding:6px}
.show{color:#7DB2FF}
.row{display:flex;justify-content:flex-end;margin:0 0 20px;font-size:.88rem}
.row a{color:#7DB2FF}
.go{
  width:100%;padding:14px;border:0;border-radius:14px;cursor:pointer;
  background:var(--yellow);color:#000;font:inherit;font-weight:700;font-size:1rem;
  box-shadow:0 8px 24px rgba(255,228,107,.28);
}
.go:hover{background:#FFEE95}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.msg{min-height:1.3em;margin:14px 0 0;font-size:.9rem;text-align:center;color:var(--err)}
.msg.ok{color:var(--yellow)}
.foot{margin:18px 0 0;text-align:center;font-size:.9rem;color:var(--muted)}
.foot a{color:#7DB2FF}
.welcome{text-align:center;padding:12px 0}
.welcome[hidden]{display:none}
.welcome h1{font-size:2.2rem;margin-bottom:10px}
.welcome .sub{margin-bottom:28px;word-break:break-word}
.badge{
  width:84px;height:84px;margin:0 auto 22px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;font-weight:800;color:#000;background:var(--yellow);
  border:1px solid var(--glass-edge);box-shadow:0 0 0 8px rgba(47,123,255,.35),0 12px 32px rgba(0,0,0,.45);
}
@media (max-width:420px){.card{padding:28px 20px}.social{grid-template-columns:1fr}}
@media (prefers-reduced-transparency:reduce){.card{background:#16161a;-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>
<main class="card">
  <div id="login">
  <h1>Welcome back</h1>
  <p class="sub">Sign in to continue.</p>

  <div class="social" id="social">
    <button type="button" data-p="Google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Google</button>
    <button type="button" data-p="GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>GitHub</button>
    <button type="button" data-p="LinkedIn"><svg viewBox="0 0 24 24" fill="#4A9BFF" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>LinkedIn</button>
    <button type="button" data-p="Apple"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>Apple</button>
  </div>

  <p class="or">or sign in with email</p>

  <form id="f" novalidate>
    <div class="field">
      <label for="u">Email</label>
      <input id="u" type="email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" type="password" placeholder="At least 8 characters" autocomplete="current-password">
      <button class="show" id="show" type="button" aria-pressed="false">Show</button>
    </div>
    <div class="row"><a href="#" onclick="return false">Reset password</a></div>
    <button class="go" type="submit">Sign in</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <p class="foot">New here? <a href="#" onclick="return false">Create an account</a></p>
  </div>

  <div id="welcome" class="welcome" hidden>
    <div class="badge" aria-hidden="true">N</div>
    <h1>Welcome to Nexus Lab</h1>
    <p class="sub" id="who">You're signed in.</p>
    <button class="go" id="out" type="button">Sign out</button>
  </div>
</main>
<script>
(function(){
  var f=document.getElementById('f'),u=document.getElementById('u'),p=document.getElementById('p'),
      msg=document.getElementById('msg'),show=document.getElementById('show');
  function say(t,ok){msg.textContent=t;msg.className='msg'+(ok?' ok':'')}
  show.addEventListener('click',function(){
    var s=p.type==='password';p.type=s?'text':'password';
    show.textContent=s?'Hide':'Show';show.setAttribute('aria-pressed',s);
  });
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!/^\S+@\S+\.\S+$/.test(u.value))return say('Enter a valid email address.');
    if(p.value.length<8)return say('Password must be at least 8 characters.');
    // Demo only: call your auth endpoint here, then run enter() on success.
    enter('Signed in as '+u.value);
  });
  document.getElementById('social').addEventListener('click',function(e){
    var b=e.target.closest('button[data-p]');if(!b)return;
    // Demo only: start the OAuth flow for this provider here, then run enter() on success.
    enter('Signed in with '+b.dataset.p);
  });
  function enter(who){
    document.getElementById('who').textContent=who;
    document.getElementById('login').hidden=true;
    document.getElementById('welcome').hidden=false;
    document.title='Nexus Lab';
  }
  document.getElementById('out').addEventListener('click',function(){
    f.reset();say('');
    document.getElementById('welcome').hidden=true;
    document.getElementById('login').hidden=false;
    document.title='Sign in';
  });
})();
</script>
</body>
</html>
